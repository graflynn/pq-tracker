<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}pq-tracker{% endblock %}</title>
<style>
  :root {
    --fg: #1d1d1f;
    --muted: #6b6b73;
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e3e3e8;
    --accent: #1d6fff;
    --pending: #b15c00;
    --answered: #0a7a2f;
    --chip-bg: #eef2ff;
  }
  body { font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
         color: var(--fg); background: var(--bg); margin: 0; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
           padding: 10px 18px; display: flex; align-items: baseline; gap: 18px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .stats { color: var(--muted); font-size: 13px; }
  header a { color: var(--accent); text-decoration: none; }
  main { padding: 16px 18px; max-width: 1300px; margin: 0 auto; }
  .filters { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
             padding: 12px; margin-bottom: 14px; display: grid;
             grid-template-columns: repeat(4, minmax(150px,1fr)); gap: 10px 14px; align-items: end; }
  .filters label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .filters input, .filters select { width: 100%; padding: 6px 8px; border: 1px solid var(--border);
                                    border-radius: 5px; font: inherit; background: white; box-sizing: border-box; }
  .filters .actions { grid-column: 1 / -1; display: flex; gap: 10px; }
  .action-bar { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
                padding: 10px 12px; margin-bottom: 14px; display: flex; gap: 10px;
                align-items: center; flex-wrap: wrap; }

  /* Unified search bar at the top of the filter form. */
  .searchbar { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px;
               padding-bottom: 10px; border-bottom: 1px dashed var(--border); margin-bottom: 4px; }
  .searchbar-input { width: 100%; padding: 9px 12px; font-size: 15px;
                     border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
  .searchbar-input:focus { outline: none; border-color: var(--accent);
                           box-shadow: 0 0 0 3px rgba(29,111,255,0.12); }
  .searchbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
                   font-size: 12px; color: var(--muted); }
  .searchbar-label { font-weight: 600; }
  .searchbar-sep { opacity: 0.4; padding: 0 4px; }
  .searchbar-advanced { font-size: 12px; }
  .searchbar-advanced summary { cursor: pointer; color: var(--accent);
                                user-select: none; padding: 2px 0; display: inline-block; }
  .searchbar-advanced summary:hover { text-decoration: underline; }
  .searchbar-advanced[open] summary { margin-bottom: 4px; }
  .cb { display: inline-flex; align-items: center; gap: 4px; margin: 0; cursor: pointer;
        color: var(--fg); font-size: 12px; }
  .cb input { width: auto !important; margin: 0; }
  .cb-disabled { opacity: 0.55; cursor: not-allowed; }
  .cb.toggle { background: #f3f4f8; padding: 2px 8px; border-radius: 10px; }
  .cb.toggle:has(input:checked) { background: #e0ebff; color: var(--accent); }
  .muted-tag { font-size: 10px; opacity: 0.7; margin-left: 2px; }
  .muted-help { font-size: 11px; opacity: 0.7; margin-left: 6px; font-style: italic; }

  /* Column-header sort + filter affordances. */
  th.th-sortable .th-sort { cursor: pointer; user-select: none; }
  th.th-sortable .th-sort:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  .sort-arrow { font-size: 10px; margin-left: 2px; opacity: 0.8; }
  th.th-filterable { position: relative; }
  .th-filter, .th-search { background: none; border: none; color: var(--muted); cursor: pointer;
               padding: 1px 4px; margin-left: 3px; vertical-align: middle;
               border-radius: 3px; display: inline-flex; align-items: center; }
  .th-filter:hover, .th-search:hover { background: rgba(29,111,255,0.12); color: var(--accent); }
  .funnel, .search-icon { display: block; }
  th.filtered { background: #e8f0ff; }
  th.filtered .th-filter, th.filtered .th-search { color: var(--accent); }
  th.filtered .funnel, th.filtered .search-icon { stroke-width: 2; }

  /* Active-filter pill row above the grid. */
  .active-filters { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
                    padding: 8px 12px; margin-bottom: 10px; display: flex; flex-wrap: wrap;
                    align-items: center; gap: 8px; font-size: 12px; }
  .active-filters-label { color: var(--muted); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 4px; background: #e8f0ff;
          color: #1a4ec0; padding: 2px 4px 2px 8px; border-radius: 12px; font-size: 12px; }
  .pill .pill-label { opacity: 0.7; font-weight: 600; }
  .pill-search { background: #fff3d6; color: #7a5a00; cursor: pointer; }
  .pill-search:hover { filter: brightness(0.95); }
  .pill-x { background: none; border: none; color: inherit; cursor: pointer;
            font-size: 16px; line-height: 1; padding: 0 5px; opacity: 0.6; border-radius: 10px; }
  .pill-x:hover { opacity: 1; background: rgba(0,0,0,0.06); }
  .active-filters-clear { color: var(--muted); text-decoration: none; margin-left: auto;
                          font-size: 12px; }
  .active-filters-clear:hover { color: var(--accent); text-decoration: underline; }

  /* Header popover. */
  .hdr-popover { position: absolute; background: white; border: 1px solid var(--border);
                 border-radius: 6px; box-shadow: 0 6px 22px rgba(0,0,0,0.14);
                 min-width: 240px; max-width: 760px; z-index: 80; padding: 8px; }
  .hdr-popover[hidden] { display: none; }
  .pop-head { font-size: 11px; color: var(--muted); text-transform: uppercase;
              letter-spacing: 0.04em; font-weight: 600; padding: 2px 4px 6px;
              display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .pop-col-clear { background: none; border: none; color: var(--accent); font-size: 10px;
                   text-transform: none; letter-spacing: 0; cursor: pointer; padding: 0;
                   font-weight: 500; }
  .pop-col-clear:hover { text-decoration: underline; }
  /* Horizontal composite — each axis becomes its own column inside .pop-row. */
  .pop-row { display: flex; gap: 12px; align-items: stretch; }
  .pop-col { flex: 1 1 200px; min-width: 180px; display: flex; flex-direction: column; }
  .pop-col .pop-list { flex: 1; }
  .pop-search { width: 100%; padding: 5px 7px; border: 1px solid var(--border);
                border-radius: 4px; font: inherit; box-sizing: border-box; margin-bottom: 6px; }
  .pop-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--border);
              border-radius: 4px; padding: 4px; background: #fafbfd; margin-bottom: 6px; }
  .pop-item { display: flex; align-items: center; gap: 6px; padding: 3px 4px;
              font-size: 13px; cursor: pointer; border-radius: 3px; }
  .pop-item:hover { background: var(--chip-bg); }
  .pop-item input { margin: 0; }
  .pop-date-row { display: flex; align-items: center; gap: 8px; padding: 3px 4px;
                  font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .pop-date-row span { width: 40px; }
  .pop-date-row input { flex: 1; padding: 4px 6px; border: 1px solid var(--border);
                        border-radius: 4px; font: inherit; }
  .pop-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .pop-text { width: 100%; padding: 6px 8px; border: 1px solid var(--border);
              border-radius: 4px; font: inherit; box-sizing: border-box; margin-bottom: 6px; }
  .sort-arrow.default-sort { opacity: 0.4; font-weight: normal; }

  /* TD cell: two lines (name + party chip on row 1, constituency on row 2). */
  .td-cell .td-line1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .td-cell .td-name { font-weight: 500; }
  .td-cell .td-constituency { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .party-chip { display: inline-block; background: #eef0f5; color: #4a5566;
                padding: 0 6px; border-radius: 8px; font-size: 10px; font-weight: 600;
                line-height: 1.5; cursor: help; }
  .pop-actions { display: flex; justify-content: flex-end; gap: 6px; padding-top: 4px; }
  .pop-actions .btn { padding: 4px 10px; font-size: 12px; }

  /* Relevance badge shown when search is sorting by score. */
  .relevance-badge { display: inline-block; background: #e8f0ff; color: #1a4ec0;
                     padding: 2px 8px; border-radius: 10px; font-size: 11px;
                     margin-left: 8px; vertical-align: middle; }
  .btn { background: var(--accent); color: white; border: none; padding: 7px 14px;
         border-radius: 5px; font: inherit; cursor: pointer; }
  .btn.secondary { background: white; color: var(--fg); border: 1px solid var(--border); }
  a.btn { text-decoration: none; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
           font-size: 13px; vertical-align: top; }
  th { background: #f3f4f8; font-weight: 600; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8f9ff; }
  .status-pending { color: var(--pending); font-weight: 500; }
  .status-answered { color: var(--answered); font-weight: 500; }
  .chip { display: inline-block; background: var(--chip-bg); padding: 1px 7px;
          border-radius: 10px; font-size: 11px; margin-right: 3px; color: #364e9f; }
  /* User tag chips look different from auto-derived topic chips. */
  .chip-tag { background: #fff3d6; color: #7a5a00; }
  .chip-tag .x { margin-left: 5px; cursor: pointer; opacity: 0.6; }
  .chip-tag .x:hover { opacity: 1; }

  /* "Group related" toggle in the action bar. */
  .group-toggle { display: inline-flex; align-items: center; gap: 5px;
                  font-size: 13px; color: var(--fg); cursor: pointer;
                  user-select: none; padding: 0 4px; }
  .group-toggle input { margin: 0; cursor: pointer; }

  /* Grouped-row expander: a tight chevron at the start of the pq_ref cell.
     Singletons get a same-width spacer so the PQ ref text stays vertically
     aligned across rows. Group size lives in the tooltip, not in the chip. */
  .group-toggle-btn, .group-toggle-spacer {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 16px; vertical-align: -3px;
    margin-right: 4px; box-sizing: border-box;
  }
  .group-toggle-btn { background: transparent; border: none; padding: 0;
                      cursor: pointer; color: var(--muted); border-radius: 3px; }
  .group-toggle-btn:hover { color: var(--accent); background: #eef2ff; }
  .group-toggle-btn .twisty-icon { transition: transform 0.12s ease; }
  tr.group-expanded .group-toggle-btn { color: var(--accent); }
  tr.group-expanded .twisty-icon { transform: rotate(90deg); }

  /* Card-style left accent on every row's pq_ref cell. Three tiers:
       - default (singleton)     : faint gray, just hints at row boundary
       - .row-group-canonical    : solid accent — this is a group header
       - .row-sibling            : matching accent + tinted bg, hidden until
                                   the canonical's twisty is clicked
     Sibling rows render as <tr>s so column visibility + the row-click
     modal handler work unchanged. */
  /* Singletons get a faint blue card tint + blue left accent. */
  tr.clickable td { background: #f5f9ff; }
  tr.clickable td.pq-ref {
    box-shadow: inset 3px 0 0 #7da8e8;
    padding-left: 10px;
  }
  /* Group canonical + siblings share the same green tint — they're one
     conceptual unit and the only thing distinguishing them visually is the
     accent shade (header darker, members lighter). Sibling rows stay
     hidden until the canonical's twisty is clicked. */
  tr.clickable.row-group-canonical td,
  tr.clickable.row-sibling td { background: #eaf6ee; }
  tr.clickable.row-group-canonical td.pq-ref {
    box-shadow: inset 3px 0 0 #4ea974;
  }
  tr.clickable.row-sibling { display: none; }
  tr.clickable.row-sibling.row-sibling-shown { display: table-row; }
  tr.clickable.row-sibling td.pq-ref {
    box-shadow: inset 3px 0 0 #9bd0b1;
  }
  /* Hover overrides the per-row tint with a uniform highlight. */
  tr.clickable:hover td { background: #eef2ff; }
  tr.clickable.row-group-canonical:hover td,
  tr.clickable.row-sibling:hover td { background: #dceee4; }

  /* Tag editor input. */
  .tag-editor { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px;
                border: 1px solid var(--border); border-radius: 5px; background: white;
                position: relative; min-height: 36px; align-items: center; }
  .tag-editor:focus-within { border-color: var(--accent); }
  .tag-editor input { flex: 1; min-width: 120px; border: none; outline: none;
                      padding: 3px 4px; font: inherit; background: transparent; }
  .tag-suggest { position: absolute; top: 100%; left: 0; right: 0; background: white;
                 border: 1px solid var(--border); border-radius: 5px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);
                 max-height: 180px; overflow-y: auto; z-index: 10; display: none; margin-top: 3px; }
  .tag-suggest.open { display: block; }
  .tag-suggest div { padding: 5px 10px; cursor: pointer; font-size: 13px; }
  .tag-suggest div:hover, .tag-suggest div.active { background: var(--chip-bg); }
  .pq-ref a { color: var(--accent); text-decoration: none; font-family: ui-monospace, monospace; }
  .pq-ref a:hover { text-decoration: underline; }
  .pagination { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
          padding: 16px 20px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600;
             text-transform: uppercase; letter-spacing: 0.04em; }
  .meta { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; font-size: 13px; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; }
  textarea, input[type=text], input[type=url] { width: 100%; padding: 7px 9px;
        border: 1px solid var(--border); border-radius: 5px; font: inherit; box-sizing: border-box; }
  textarea { min-height: 60px; resize: vertical; }
  .qa-body { white-space: pre-wrap; line-height: 1.55; }
  /* When the modal renders rich HTML (from xml_raw) the inner block elements
     drive layout, so pre-wrap on the container would only show up between
     them — the converter joins blocks with "" to avoid that. These rules
     scope reasonable defaults for the subset we emit. */
  .qa-body p { margin: 0 0 10px; }
  .qa-body p:last-child { margin-bottom: 0; }
  .qa-body h3 { font-size: 14px; margin: 14px 0 6px; font-weight: 600; }
  .qa-body ul { margin: 6px 0 10px 22px; padding: 0; }
  .qa-body ul li { margin: 2px 0; }
  .qa-body table { border-collapse: collapse; margin: 10px 0; font-size: 13px;
                   white-space: normal; }
  .qa-body table caption { text-align: left; font-weight: 600; padding: 4px 0;
                           caption-side: top; color: var(--muted); }
  .qa-body td, .qa-body th { border: 1px solid var(--border); padding: 4px 8px;
                             vertical-align: top; }
  .qa-body th { background: #f6f7fb; }
  .qa-body strong { font-weight: 600; }
  .qa-body em { font-style: italic; }
  .saved { color: var(--answered); margin-left: 10px; font-size: 13px; }
  .truncate { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden; max-width: 60ch; }
  .muted { color: var(--muted); font-size: 12px; }
  /* "Also answered with ..." block in the modal — surfaces grouped/templated
     answers via the shared answer_id. Subtle so it doesn't compete with the
     answer body, but easy to scan. */
  .shared-answer { margin-top: 14px; padding: 10px 12px;
                   border-left: 3px solid var(--border); background: #fafbfd;
                   border-radius: 0 4px 4px 0; font-size: 13px; }
  .shared-answer #m-shared-label { color: var(--muted); font-size: 12px;
                                   font-weight: 600; margin-bottom: 6px; }
  .shared-answer a.shared-pq { font-family: ui-monospace, Menlo, monospace;
                               text-decoration: none; }
  .shared-answer a.shared-pq:hover { text-decoration: underline; }
  /* Off-corpus siblings (the minister grouped a non-diabetes PQ we never
     ingested). Link out to Oireachtas; visually distinct so the user can
     tell at a glance that the click leaves the app. */
  .shared-answer a.shared-pq-ext { font-family: ui-monospace, Menlo, monospace;
                                   text-decoration: none; color: var(--muted); }
  .shared-answer a.shared-pq-ext:hover { text-decoration: underline; color: inherit; }

  /* clickable rows */
  tr.clickable { cursor: pointer; }

  /* modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,20,30,0.45);
                    display: none; align-items: flex-start; justify-content: center;
                    padding: 40px 20px; overflow-y: auto; z-index: 100; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--card); border-radius: 10px; max-width: 880px; width: 100%;
           box-shadow: 0 20px 60px rgba(0,0,0,0.18); overflow: hidden; }
  .modal.modal-narrow { max-width: 560px; }
  .modal.modal-pdf { max-width: 1100px; }
  .q-cell { display: flex; align-items: flex-start; gap: 6px; }
  .q-cell .truncate { flex: 1; min-width: 0; }
  .hse-icon { display: inline-flex; align-items: center; justify-content: center;
              width: 16px; height: 16px; flex: 0 0 16px; padding: 0;
              background: none; border: 0; color: var(--muted);
              cursor: pointer; border-radius: 3px; margin-top: 1px; }
  .hse-icon:hover { color: var(--accent, #2566c4); background: #eaf1fb; }
  .hse-icon-empty { cursor: default; visibility: hidden; }
  .modal-head { display: flex; align-items: baseline; justify-content: space-between;
                padding: 14px 20px; border-bottom: 1px solid var(--border); background: #f6f7fb; }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-head .close { background: none; border: none; font-size: 22px; cursor: pointer;
                       color: var(--muted); line-height: 1; padding: 0 6px; }
  .modal-body { padding: 18px 20px; max-height: 78vh; overflow-y: auto; }
  .modal-body .meta { margin-bottom: 16px; }
  .modal-body section { margin-bottom: 14px; }
  .modal-body section h3 { font-size: 12px; color: var(--muted); font-weight: 600;
                           text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 6px; }
  .summary-strip { font-size: 12px; padding: 8px 10px; background: #f6f7fb;
                   border: 1px solid var(--border); border-radius: 6px;
                   line-height: 1.5; }
  .summary-strip .summary-row { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .summary-strip .sk { color: var(--muted); margin-right: 4px; }
  .summary-strip .chip { font-size: 11px; padding: 0 6px; margin-right: 2px; }
  .qa-body mark { background: #fff3a8; padding: 0 2px; border-radius: 2px; }
  .modal-foot { padding: 12px 20px; border-top: 1px solid var(--border); background: #f6f7fb;
                display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
  .modal-foot .status { color: var(--answered); margin-right: auto; font-size: 13px; min-height: 18px; }
  .modal-foot .status.error { color: #b30000; }
  body.modal-open { overflow: hidden; }
</style>
</head>
<body>
<header>
  <h1><a href="{{ url_for('list_view') }}" style="color:inherit;text-decoration:none;">pq-tracker</a></h1>
  <span class="stats">{% block headerstats %}{% endblock %}</span>
  <span style="margin-left:auto;"><a href="{{ url_for('settings_view') }}">Settings</a></span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
