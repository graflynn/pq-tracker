# search_terms: ingestion gate. A PQ is only stored if at least one term
#   appears in its text. Supports trailing-`*` wildcard (e.g. diabet* matches
#   diabetes/diabetic/diabetics). Case- and hyphen-insensitive.
# keywords: auto-tags applied to ingested PQs for display/filtering. Removing
#   a keyword drops the tag, not the row. Use the Settings page button
#   'Rebuild auto-tags' to retroactively re-apply after edits.
# Both are maintained from /settings, but you can hand-edit too.

search_terms:
- diabet*
- cgm
- dafne
keywords:
- cgm
- insulin pump
- type 1
- type 2
- dafne
- paediatric
- adults
- education
- resources
lookback_days: 1
chambers:
- dail
xml_fetch_delay_ms: 250
